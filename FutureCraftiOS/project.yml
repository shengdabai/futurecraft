name: FutureCraftiOS
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: 17.0
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.zturns.futurecraft
    PRODUCT_NAME: FutureCraft
targets:
  FutureCraftiOS:
    type: application
    platform: iOS
    sources:
      - path: FutureCraftiOS
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - FutureCraftiOS.entitlements
    resources:
      - FutureCraftiOS/PrivacyInfo.xcprivacy
    info:
      path: FutureCraftiOS/Info.plist
    entitlements:
      path: FutureCraftiOS/FutureCraftiOS.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
